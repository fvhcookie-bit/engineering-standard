name: docs-consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Consistency of the standard's own documents (ROADMAP A-3)
        run: python tools/doc_consistency.py
      - name: Digest freshness (ROADMAP B-9)
        run: python tools/build_digest.py --check
      - name: Digest freshness, English translation
        run: python tools/build_digest.py --lang en --check
