name: tooling

on:
  push:
    branches: [main]
    paths: ["tooling/**", ".github/workflows/tooling.yml"]
  pull_request:
    paths: ["tooling/**", ".github/workflows/tooling.yml"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/requirements.txt -r tooling/requirements-dev.txt
      - name: Unit tests (contract-first, coverage >= 80% — C-7)
        run: |
          python -m pytest tooling/tests -q \
            --cov=tooling/core --cov=tooling/gates --cov=tooling/runner \
            --cov=tooling/adapters --cov=tooling/collector \
            --cov-report=term --cov-fail-under=80
      - name: Ruff
        run: python -m ruff check --config tooling/pyproject.toml tooling
      - name: Mypy strict
        run: python -m mypy --strict tooling/core tooling/gates tooling/runner tooling/adapters tooling/collector.py

  self-gate-q11:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Diff (PR — от базы; пуш — предыдущий коммит)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/self.patch
          else
            if ! git diff "${{ github.event.before }}..HEAD" > /tmp/self.patch 2>/dev/null; then
              git diff "HEAD~1..HEAD" > /tmp/self.patch
            fi
          fi
      - name: Q-11 self-gate (companion догейтится собственным словарём)
        env:
          PYTHONPATH: tooling
        run: |
          set +e
          python -m runner.cli run --gate q11_suppressions --diff /tmp/self.patch \
            --repo-root tooling --config tooling/self_q11.json \
            --adapter fake --out /tmp/q11_report.json
          code=$?
          cat /tmp/q11_report.json
          exit $code
      - uses: actions/upload-artifact@v7
        with:
          name: q11-report
          path: /tmp/q11_report.json
