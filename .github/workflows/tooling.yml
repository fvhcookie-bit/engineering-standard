name: tooling

on:
  push:
    branches: [main]
    paths: ["tooling/**", ".github/workflows/tooling.yml"]
  pull_request:
    paths: ["tooling/**", ".github/workflows/tooling.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/requirements.txt -r tooling/requirements-dev.txt
      - name: Unit tests (contract-first)
        run: python -m pytest tooling/tests -q
      - name: Ruff
        run: python -m ruff check tooling
      - name: Mypy strict
        run: python -m mypy --strict tooling/core tooling/gates tooling/runner tooling/adapters
