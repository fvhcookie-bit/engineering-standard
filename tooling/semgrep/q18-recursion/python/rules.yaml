rules:
  - id: q18-recursion-no-depth
    message: "A2/Q-18: рекурсия без явного предела глубины"
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          # рекурсивный вызов в return и в позиции statement — разные паттерны:
          # statement-паттерн $F(...) не матчит вызов внутри `return`
          - pattern: |
              def $F(...):
                  ...
                  return $F(...)
          - pattern: |
              def $F(...):
                  ...
                  $F(...)
      - pattern-not: |
          def $F(..., $DEPTH, ...):
              ...
              return $F(..., $DEPTH + 1, ...)
      - pattern-not: |
          def $F(..., $DEPTH, ...):
              ...
              $F(..., $DEPTH + 1, ...)

  # Семантика правил циклов: while True, в теле которого ТОЛЬКО блокирующее
  # чтение (без break/счётчика/условия) — цикл без границы. Циклы с любым
  # дополнительным оператором (счётчик, if-not-data-break) не матчатся —
  # это сознательная точность в ущерб полноте (ограничение отмечено в README).
  - id: q18-infinite-read-loop
    message: "A3/Q-18: бесконечный цикл чтения потока без счётчика-максимума"
    severity: ERROR
    languages: [python]
    pattern: |
      while True:
          $DATA = $STREAM.read(...)

  - id: q18-infinite-recv-loop
    message: "A3/Q-18: бесконечный цикл приёма из сокета без счётчика"
    severity: ERROR
    languages: [python]
    pattern: |
      while True:
          $PACKET = $SOCK.recv(...)

  - id: q18-infinite-readline-loop
    message: "A3/Q-18: бесконечный цикл readline без счётчика-максимума"
    severity: ERROR
    languages: [python]
    pattern: |
      while True:
          $LINE = $F.readline()
