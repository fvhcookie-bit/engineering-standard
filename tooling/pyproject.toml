[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standards-tooling-runner"
version = "0.1.0a0"
description = "gate-runner: детерминированные guard-гейты инженерного стандарта v1.2"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gates*", "runner*", "adapters*"]

[tool.ruff]
line-length = 120
extend-exclude = ["fixtures", "dictionaries"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
